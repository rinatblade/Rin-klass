plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rin.klass'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rin.klass'
        minSdk 26
        targetSdk 34
        // Номер сборки из GitHub Actions: каждое следующее обновление ставится поверх предыдущего.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    // Один и тот же ключ во всех сборках - APK обновляется поверх старого без удаления.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'
}
